services:
  - type: web
    name: vazhithunai-backend
    env: docker
    region: oregon
    plan: free
    branch: main
    rootDir: backend
    healthCheckPath: /
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: PINECONE_API_KEY
        sync: false
